name: Scrape Daylight Data

on:
  # Run automatically on 1st of every month at 6:00 AM IST (00:30 UTC)
  schedule:
    - cron: "30 0 1 * *"

  # Also allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      year:
        description: "Year to scrape (e.g. 2025)"
        required: false
        default: "2025"
      city:
        description: "City to scrape (Bengaluru/Delhi/Mumbai/Chennai/Kolkata)"
        required: false
        default: "Bengaluru"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repo
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Install Chrome
      - name: Install Chrome
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      # 4. Install Python dependencies
      - name: Install dependencies
        run: |
          pip install selenium webdriver-manager pandas

      # 5. Run the scraper
      - name: Run scraper
        run: |
          python src/scraper_actions.py ${{ github.event.inputs.year || '2025' }} "${{ github.event.inputs.city || 'Bengaluru' }}"

      # 6. Run the cleaner
      - name: Run cleaner
        run: |
          python src/cleaner.py ${{ github.event.inputs.year || '2025' }}

      # 7. Commit and push updated CSVs back to repo
      - name: Commit updated data
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "Auto-scrape: update daylight data $(date +'%Y-%m-%d')"
          git push